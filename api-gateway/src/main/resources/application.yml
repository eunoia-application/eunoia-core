spring:
  application:
    name: api-gateway
  liquibase:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # gateway проверяет токены по публичному ключу auth (JWKS). Локально — прямой адрес;
          # lb:// декодер не понимает (это схема роутинга), а issuer-uri тянет OIDC-discovery на старте.
          # Load-balanced JWKS через Eureka — это M5.
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 7777

# Кто из браузера может стучаться в API (CORS). Dev — фронт на :9000; в проде переопределяем через env.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:9000}

application:
  api-routes:
    - id: "service-auth"
      from: "api/v1/auth"
      to: "lb://SERVICE-AUTH"
    - id: "service-user"
      from: "api/v1/user"
      to: "lb://SERVICE-USER"
    - id: "service-note"
      from: "api/v1/note"
      to: "lb://SERVICE-NOTE"


eureka:
  client:
    registerWithEureka: false
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9999/eureka/}
  instance:
    lease-renewal-interval-in-seconds: 30
    metadataMap:
      zone: zone1

management:
  tracing:
    sampling:
      probability: 1.0
  endpoint:
    prometheus:
      enabled: true
    metrics:
      enabled: true
    health:
      enabled: true
      probes:
        enabled: true
    refresh:
      enabled: true
  endpoints:
    web:
      exposure:
        include:
          - prometheus
          - health
          - metrics
          - refresh
    enabled-by-default: false