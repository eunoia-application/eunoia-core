# Схема БД service-user. Профиль по userId (тот же id, что identity в auth — приходит событием UserRegistered).
databaseChangeLog:
  - changeSet:
      id: 001-create-profiles
      author: eunoia
      changes:
        - createTable:
            tableName: profiles
            columns:
              - column: { name: user_id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: varchar(320), constraints: { nullable: false } }
              - column: { name: username, type: varchar(100), constraints: { nullable: false } }
              - column: { name: first_name, type: varchar(50) }
              - column: { name: last_name, type: varchar(50) }
              - column: { name: avatar_url, type: varchar(1000) }
              - column: { name: bio, type: varchar(500) }
              - column: { name: email_verified, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: theme, type: varchar(10), constraints: { nullable: false } }
              - column: { name: interface_language, type: varchar(10) }
              - column: { name: profile_visibility, type: varchar(10), constraints: { nullable: false } }
              - column: { name: email_notifications, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: ai_suggestions_enabled, type: boolean, defaultValueBoolean: true, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, constraints: { nullable: false } }
