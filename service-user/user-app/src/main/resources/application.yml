server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: service-user

  # БД профилей (Design B: identity — в auth, здесь только профиль).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${DB_USERNAME:user_db}
    password: ${DB_PASSWORD:user_password}

  jpa:
    hibernate:
      ddl-auto: none      # схемой владеет Liquibase
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  # Валидируем JWT от auth его же публичным ключом (JWKS). Прямой адрес; lb:// — это M5.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  # Слушаем события auth. Продюсер (auth) и консюмер (user) — разные DTO, поэтому
  # игнорируем type-заголовки и десериализуем в тип листенера.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: service-user
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

# Регистрация в Eureka. Локально — как localhost (иначе gateway не достучится по LAN-IP).
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:9999/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info
