# ============================================
# SPRING APPLICATION CONFIG
# ============================================
spring:
  application:
    name: service-auth

  # ============================================
  # DATABASE CONFIGURATION (для auth БД)
  # ============================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000

  # ============================================
  # JPA / HIBERNATE CONFIG
  # ============================================
  jpa:
    hibernate:
      ddl-auto: validate  # validate, update, create, create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: ${SHOW_SQL:false}
    open-in-view: false

  # ============================================
  # LIQUIBASE (миграции)
  # ============================================
  liquibase:
    enabled: ${LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/master.xml
    contexts: ${LIQUIBASE_CONTEXTS:!test}

  # ============================================
  # WEB CONFIG
  # ============================================
  web:
    resources:
      add-mappings: false  # Отключаем статические ресурсы для API

  # ============================================
  # SECURITY (Spring Security Basic Auth - отключен)
  # ============================================
  security:
    user:
      name:
      password:

  # ============================================
  # SERVLET CONFIG
  # ============================================
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ============================================
  # CLOUD CONFIG (Eureka Client)
  # ============================================
  cloud:
    discovery:
      enabled: true
    loadbalancer:
      ribbon:
        enabled: false
      cache:
        enabled: true
        ttl: 30s

  # ============================================
  # MAIL CONFIG (для отправки email)
  # ============================================
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp
        debug: ${MAIL_DEBUG:false}

# ============================================
# SERVER CONFIG
# ============================================
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    connection-timeout: 10000
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10

# ============================================
# EUREKA CLIENT CONFIG
# ============================================
eureka:
  client:
    enabled: true
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 30
    instance-info-replication-interval-seconds: 30
    initial-instance-info-replication-interval-seconds: 40

  instance:
    hostname: ${HOSTNAME:localhost}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    metadata-map:
      zone: ${EUREKA_ZONE:zone1}
      version: 1.0.0

# ============================================
# JWT CONFIGURATION
# ============================================
jwt:
  secret: ${JWT_SECRET:3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000}      # 1 час
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:2592000000} # 30 дней
  issuer: ${JWT_ISSUER:service-auth}
  audience: ${JWT_AUDIENCE:eunoia-app}

# ============================================
# RESILIENCE4J CONFIG (Circuit Breaker, Retry, etc.)
# ============================================
resilience4j:
  # Circuit Breaker
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        minimum-number-of-calls: 10

    instances:
      userService:
        base-config: default
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - javax.naming.ServiceUnavailableException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException.NotFound

  # Retry
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms

    instances:
      userService:
        base-config: default
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
          - org.springframework.dao.TransientDataAccessException

  # Time Limiter
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
        cancel-running-future: true

    instances:
      userService:
        base-config: default

  # Bulkhead (опционально)
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 25
        max-wait-duration: 0

    instances:
      userService:
        base-config: default

# ============================================
# TOKEN CONFIGURATION
# ============================================
token:
  refresh-token:
    expiration-days: 30
  email-verification:
    expiration-hours: 24
  password-reset:
    expiration-minutes: 60

# ============================================
# LOGGING CONFIG
# ============================================
logging:
  level:
    ru.eunoia: ${LOG_LEVEL:DEBUG}
    org.springframework.web: INFO
    org.hibernate: WARN
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:DEBUG}
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %highlight(%-5level) - %cyan(%logger{36}) - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} - %-5level - %logger{36} - %msg%n"
  file:
    name: logs/auth-service.log
    max-size: 10MB
    max-history: 30

# ============================================
# ACTUATOR / MANAGEMENT ENDPOINTS
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,circuitbreakers
      base-path: /actuator
    enabled-by-default: false
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
    loggers:
      enabled: true
    env:
      enabled: true
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      zone: ${eureka.instance.metadata-map.zone}
  tracing:
    sampling:
      probability: 1.0

# ============================================
# APPLICATION SPECIFIC CONFIG
# ============================================
application:
  security:
    # CORS настройки
    cors:
      allowed-origins: "http://localhost:3000,http://localhost:8080"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      max-age: 3600

    # Password policy
    password:
      min-length: 8
      require-uppercase: true
      require-lowercase: true
      require-digit: true
      require-special: false

  # Email templates
  email:
    templates:
      verification: "email-verification.html"
      password-reset: "password-reset.html"
      welcome: "welcome.html"

  # User limits
  limits:
    max-refresh-tokens-per-user: 5
    max-failed-login-attempts: 5
    account-lock-duration-minutes: 30

  # External services
  services:
    user-service:
      name: service-user
      timeout-ms: 5000
      max-retries: 3
      base-url: http://service-user

# ============================================
# OPENAPI / SWAGGER CONFIG
# ============================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  paths-to-match: /api/**