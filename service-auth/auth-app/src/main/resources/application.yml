server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: service-auth

  # БД auth: хранит учётки (Design B). Профиль — в service-user.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:auth_password}

  jpa:
    hibernate:
      ddl-auto: none      # схемой владеет Liquibase, Hibernate её не трогает
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

# JWT подписывается RS256; ключ сервис генерит сам. Здесь — только время жизни (секунды) и issuer.
jwt:
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:3600}       # 1 час
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:2592000}  # 30 дней
  issuer: ${JWT_ISSUER:service-auth}

# В M1 сервис поднимается автономно; Eureka включается переменной окружения.
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
