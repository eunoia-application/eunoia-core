# Схема оверлея мастерства (контекст garden) в Postgres. Канон знаний живёт отдельно в Neo4j.
# mastery связан с графом только по lexeme_id (id узла Neo4j, напр. en:go:VERB) — без FK.
databaseChangeLog:
  - changeSet:
      id: 001-create-mastery
      author: eunoia
      changes:
        - createTable:
            tableName: mastery
            columns:
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: lexeme_id, type: varchar(120), constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: mastery
            columnNames: user_id, lexeme_id
            constraintName: pk_mastery

  # Журнал занятий: (user_id, day) → число действий за день. Питает стрики/погоду/сезоны дерева.
  - changeSet:
      id: 002-create-activity-log
      author: eunoia
      changes:
        - createTable:
            tableName: activity_log
            columns:
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: day, type: date, constraints: { nullable: false } }
              - column: { name: actions, type: int, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: activity_log
            columnNames: user_id, day
            constraintName: pk_activity_log

  # Прогресс по грамматике: (user_id, grammar_id) → статус. Параллель к mastery (по словам);
  # grammar_id ссылается на узел Grammar в Neo4j без FK. Даёт «высоту» дерева.
  - changeSet:
      id: 003-create-grammar-mastery
      author: eunoia
      changes:
        - createTable:
            tableName: grammar_mastery
            columns:
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: grammar_id, type: varchar(120), constraints: { nullable: false } }
              - column: { name: status, type: varchar(20), constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: grammar_mastery
            columnNames: user_id, grammar_id
            constraintName: pk_grammar_mastery
